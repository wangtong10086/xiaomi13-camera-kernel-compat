name: Compatibility report
description: Report a reproducible fuxi camera or OIS compatibility result.
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: Do not include serial numbers, account data, proprietary binaries, or unsanitized logs.
  - type: input
    id: build
    attributes:
      label: ROM and kernel build
      description: Provide public build identifiers and exact commits only.
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Overlay commit or artifact SHA-256
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Reproduction and result
    validations:
      required: true
  - type: dropdown
    id: rollback
    attributes:
      label: Rollback verified
      options: ["Yes", "No", "Not applicable"]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, device serials, tokens, keys, and proprietary binaries.
          required: true
